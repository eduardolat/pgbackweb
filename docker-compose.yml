version: "3.8"

services:
  # PostgreSQL database for PG Back Web
  postgres-pgbackweb:
    image: postgres:18
    container_name: pgbackweb_postgres_main
    environment:
      POSTGRES_USER: pgbackweb
      POSTGRES_PASSWORD: pgbackweb_password
      POSTGRES_DB: pgbackweb
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"

  # PostgreSQL database for testing
  postgres-test:
    image: postgres:18
    container_name: pgbackweb_postgres_test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testuser_password
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"

  # PG Back Web application
  pgbackweb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pgbackweb_app
    environment:
      PBW_ENCRYPTION_KEY: "test_encryption_key_32_chars_long!"
      PBW_POSTGRES_CONN_STRING: "postgresql://pgbackweb:pgbackweb_password@postgres-pgbackweb:5432/pgbackweb?sslmode=disable"
      PBW_LISTEN_HOST: "0.0.0.0"
      PBW_LISTEN_PORT: "8085"
      PBW_PATH_PREFIX: ""
      PBW_ENABLE_METRICS: "true"
      PBW_METRICS_LISTEN_HOST: "0.0.0.0"
      PBW_METRICS_LISTEN_PORT: "2112"
    ports:
      - "8085:8085"
      - "2112:2112"
    depends_on:
      - postgres-pgbackweb
    restart: unless-stopped
